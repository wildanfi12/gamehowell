<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c99a61"/>
      <stop offset="100%" stop-color="#8a5e30"/>
    </linearGradient>
    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d061"/>
      <stop offset="100%" stop-color="#e2b030"/>
    </linearGradient>
  </defs>
  
  <!-- Main cardboard box -->
  <rect x="18" y="24" width="64" height="60" rx="8" fill="url(#boxGrad)" stroke="#5c3a16" stroke-width="2.5" filter="drop-shadow(0 6px 8px rgba(0,0,0,0.35))"/>
  
  <!-- Box flaps and crease lines -->
  <line x1="50" y1="24" x2="50" y2="84" stroke="#5c3a16" stroke-width="2" stroke-dasharray="4,2"/>
  <rect x="18" y="24" width="64" height="14" rx="4" fill="url(#tapeGrad)" stroke="#8c6a1e" stroke-width="1.5" opacity="0.85"/>
  
  <!-- Heavy crack lightning across box -->
  <path d="M 50 24 L 42 40 L 56 50 L 40 68 L 48 84" fill="none" stroke="#22150a" stroke-width="3.5" stroke-linejoin="round"/>
  
  <!-- Hazard Caution Badge (Red Triangle with Exclamation) -->
  <g transform="translate(50, 56)">
    <!-- Warning Triangle -->
    <polygon points="0,-22 22,14 -22,14" fill="#ff3344" stroke="#ffffff" stroke-width="2.5" filter="drop-shadow(0 3px 4px rgba(0,0,0,0.4))"/>
    <!-- Exclamation mark inside -->
    <line x1="0" y1="-12" x2="0" y2="2" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="8" r="2.2" fill="#ffffff"/>
  </g>
  
  <!-- Broken tape / caution ribbon -->
  <g transform="translate(50, 88)">
    <rect x="-24" y="-8" width="48" height="14" rx="3" fill="#ff3b30" stroke="#b30010" stroke-width="1.5"/>
    <text x="0" y="2" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="9" text-anchor="middle" letter-spacing="1">RUSAK</text>
  </g>
</svg>