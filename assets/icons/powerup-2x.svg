<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8cc"/>
      <stop offset="60%" stop-color="#ffb700"/>
      <stop offset="100%" stop-color="#d47a00"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff099"/>
      <stop offset="50%" stop-color="#ffa500"/>
      <stop offset="100%" stop-color="#cc6600"/>
    </linearGradient>
  </defs>
  <!-- Outer glowing burst ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#ffe066" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.8"/>
  <circle cx="50" cy="50" r="39" fill="url(#goldGlow)" stroke="url(#ringGrad)" stroke-width="3" filter="drop-shadow(0 4px 8px rgba(255,165,0,0.5))"/>
  
  <!-- Highlight reflection -->
  <ellipse cx="40" cy="30" rx="20" ry="10" fill="#ffffff" opacity="0.35"/>
  
  <!-- "2X" Text -->
  <text x="50" y="59" fill="#5c2e00" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="34" text-anchor="middle" letter-spacing="-1" stroke="#ffffff" stroke-width="3" paint-order="stroke fill">2X</text>
  
  <!-- Sparkles -->
  <path d="M 78 22 L 81 28 L 87 31 L 81 34 L 78 40 L 75 34 L 69 31 L 75 28 Z" fill="#ffffff"/>
  <path d="M 22 70 L 24 74 L 28 76 L 24 78 L 22 82 L 20 78 L 16 76 L 20 74 Z" fill="#ffffff" opacity="0.85"/>
</svg>