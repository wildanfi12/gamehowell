<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="clockBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ff"/>
      <stop offset="40%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#004e92"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Aura -->
  <circle cx="50" cy="54" r="42" fill="none" stroke="#00d2d3" stroke-width="2" stroke-dasharray="8,4" opacity="0.7"/>
  
  <!-- Stopwatch Top Button -->
  <rect x="45" y="10" width="10" height="6" rx="2" fill="#718093"/>
  <rect x="42" y="7" width="16" height="4" rx="2" fill="#dcdde1"/>
  
  <!-- Stopwatch Case -->
  <circle cx="50" cy="54" r="34" fill="url(#clockBg)" stroke="#f5f6fa" stroke-width="3" filter="drop-shadow(0 4px 10px rgba(0,210,211,0.6))"/>
  
  <!-- Inner Dial Face -->
  <circle cx="50" cy="54" r="26" fill="#0d1b2a"/>
  
  <!-- Tick marks -->
  <circle cx="50" cy="32" r="1.5" fill="#00d2d3"/>
  <circle cx="72" cy="54" r="1.5" fill="#00d2d3"/>
  <circle cx="50" cy="76" r="1.5" fill="#00d2d3"/>
  <circle cx="28" cy="54" r="1.5" fill="#00d2d3"/>
  
  <!-- Slow Motion Curved Arc -->
  <path d="M 50 34 A 20 20 0 0 1 68 62" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Stopwatch Hands (showing slow frozen freeze) -->
  <line x1="50" y1="54" x2="50" y2="38" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="54" x2="63" y2="46" stroke="#ff4757" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="54" r="3" fill="#ffffff"/>
  
  <!-- Ice crystals / Slow breeze snowflakes -->
  <path d="M 20 30 L 26 36 M 26 30 L 20 36" stroke="#00ffff" stroke-width="1.5"/>
  <path d="M 76 74 L 82 80 M 82 74 L 76 80" stroke="#00ffff" stroke-width="1.5"/>
</svg>