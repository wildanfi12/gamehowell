<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8ff78"/>
      <stop offset="50%" stop-color="#2ed573"/>
      <stop offset="100%" stop-color="#10ac84"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#fdcb6e"/>
    </linearGradient>
  </defs>
  
  <!-- Outer glowing burst ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#2ed573" stroke-width="2.5" stroke-dasharray="5,3" opacity="0.8"/>
  
  <!-- 8-Pointed Starburst Badge -->
  <polygon points="50,6 63,22 83,17 83,38 98,50 83,62 83,83 63,78 50,94 37,78 17,83 17,62 2,50 17,38 17,17 37,22" 
           fill="url(#emeraldGlow)" stroke="url(#goldBorder)" stroke-width="2.5" filter="drop-shadow(0 4px 10px rgba(46,213,115,0.6))"/>
           
  <!-- Inner Circle -->
  <circle cx="50" cy="50" r="26" fill="#0c4224" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  
  <!-- "+30" Text -->
  <text x="50" y="58" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="-0.5" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.5))">+30</text>
  
  <!-- Little Sparkle Stars -->
  <circle cx="34" cy="36" r="2" fill="#ffffff"/>
  <circle cx="66" cy="64" r="1.5" fill="#ffffff"/>
</svg>