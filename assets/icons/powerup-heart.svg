<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="heartGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7675"/>
      <stop offset="45%" stop-color="#d63031"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>
  </defs>
  
  <!-- Outer pulse ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#ff4757" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  
  <!-- Heart Shape -->
  <path d="M 50 82 C 22 62, 10 44, 16 28 C 22 14, 38 14, 50 28 C 62 14, 78 14, 84 28 C 90 44, 78 62, 50 82 Z" 
        fill="url(#heartGlow)" stroke="#ffffff" stroke-width="2.5" filter="drop-shadow(0 6px 12px rgba(214,48,49,0.6))"/>
        
  <!-- Specular highlight -->
  <path d="M 24 28 C 26 22, 33 20, 40 24 C 36 26, 30 28, 28 36 Z" fill="#ffffff" opacity="0.6"/>
  
  <!-- Plus badge -->
  <g transform="translate(68, 26)">
    <circle cx="0" cy="0" r="14" fill="#2ed573" stroke="#ffffff" stroke-width="2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>