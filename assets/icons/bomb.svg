<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bombBody" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4a4d56"/>
      <stop offset="45%" stop-color="#212429"/>
      <stop offset="90%" stop-color="#0e1013"/>
      <stop offset="100%" stop-color="#050607"/>
    </radialGradient>
    <linearGradient id="bombCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6d1f"/>
    </linearGradient>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9d2"/>
      <stop offset="40%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff0044" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Bomb body -->
  <circle cx="50" cy="58" r="34" fill="url(#bombBody)" filter="drop-shadow(0 6px 8px rgba(0,0,0,0.4))"/>
  
  <!-- Specular shine on body -->
  <ellipse cx="40" cy="45" rx="10" ry="6" fill="#ffffff" opacity="0.32" transform="rotate(-30 40 45)"/>
  <circle cx="34" cy="40" r="2.5" fill="#ffffff" opacity="0.5"/>
  
  <!-- Bomb cap -->
  <rect x="42" y="22" width="16" height="8" rx="2" fill="url(#bombCap)" stroke="#5a4510" stroke-width="1"/>
  
  <!-- Fuse path -->
  <path d="M 50 22 Q 52 12, 64 12 T 74 6" fill="none" stroke="#d2b48c" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Warning skull or exclamation mark on bomb body -->
  <path d="M 50 48 L 50 63" stroke="#ff3b30" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="50" cy="72" r="2.8" fill="#ff3b30"/>
  
  <!-- Fuse spark -->
  <circle cx="75" cy="6" r="10" fill="url(#sparkGlow)" filter="url(#glow)"/>
  <path d="M 75 1 L 75 11 M 70 6 L 80 6 M 71 2 L 79 10 M 71 10 L 79 2" stroke="#fffae0" stroke-width="2" stroke-linecap="round"/>
</svg>